# scripts/check.conf — the steps behind the single verification contract (./scripts/check).
# Stack: .NET 10 (Api) + Angular 21 (web) + PostgreSQL 17 (Testcontainers in integration tests).
# Format: <name>: <command> — runs in order, fails fast.
#
# GREENFIELD DURUMU (bootstrap, 2026-10-14): henüz solution/workspace yok, bu yüzden tüm adımlar
# yorumda. İlk spec'in iskeleti kurulduğunda ilgili satırların '# ' önekini kaldır — komutlar ve
# kaynak hijyeni anahtarları zaten hazır. O ana kadar ./scripts/check 'greenfield no-op' döner.
#
# ---------------------------------------------------------------------------------------------
# RESOURCE HYGIENE — envanter (docs/testing.md, Resource hygiene)
# Bu yığının geride bırakabileceği süreçler ve nötrleştirmeleri:
#   1. MSBuild worker node'ları (dotnet build/test)      -> -nodeReuse:false
#   2. Roslyn compile server, VBCSCompiler               -> -p:UseSharedCompilation=false
#   3. .NET build server (Razor/MSBuild kalıntısı)       -> adım sonunda 'dotnet build-server shutdown'
#   4. Testhost süreçleri (dotnet test)                  -> koşu sonunda kendileri çıkar; 3 ile birlikte garanti
#   5. Testcontainers PostgreSQL + Ryuk konteynerleri    -> aynı adımda 'docker stop', çıkış kodu korunarak
#   6. Angular test izleme (watch) modu ve tarayıcı      -> --watch=false, headless tarayıcı
#   7. Playwright tarayıcıları ve webServer              -> --workers=1, reuseExistingServer: false (playwright.config)
#   8. Vite/esbuild servis süreci                        -> build/test modunda ebeveynle birlikte sonlanır
# Kanıt: residue test (./scripts/check iki kez; süreç sayısı ve bellek taban değere döner).
# ---------------------------------------------------------------------------------------------
#
# --- backend ---
# resource hygiene: 1 (no MSBuild node reuse) + 2 (no shared compiler server)
# restore: dotnet restore --locked-mode -nodeReuse:false
# build: dotnet build --no-restore -c Release -nodeReuse:false -p:UseSharedCompilation=false
# format: dotnet format --no-restore --verify-no-changes
# resource hygiene: 5 — konteynerler aynı adımda durdurulur, çıkış kodu korunur (check fail-fast)
# test: sh -c 'dotnet test --no-build -c Release -nodeReuse:false -p:UseSharedCompilation=false; rc=$?; docker ps -q --filter label=org.testcontainers=true | xargs -r docker stop >/dev/null 2>&1; exit $rc'
# resource hygiene: 3 + 4 — build/test sunucusu kapatılır (başarısız adımdan sonra da ulaşılır değilse
# yukarıdaki test adımının içine taşı)
# shutdown: dotnet build-server shutdown
#
# --- frontend (web/) ---
# install: sh -c 'cd web && npm ci --no-fund --no-audit'
# lint: sh -c 'cd web && npm run lint'   # ESLint + boundaries kuralı (yasak bağımlılık 5)
# resource hygiene: 6 — watch kapalı, headless
# webtest: sh -c 'cd web && npm run test -- --watch=false'
# webbuild: sh -c 'cd web && npm run build'
#
# --- e2e (son, en pahalı) ---
# resource hygiene: 7 — tek işçi, headless; app yaşam döngüsünün sahibi playwright.config webServer
# e2e: sh -c 'cd web && npx playwright test --workers=1 --reporter=line'
