<main class="page">
  <h1>Şifrenizi değiştirin</h1>
  <p class="lead">
    Hesabınız geçici bir şifreyle açıldı. Devam etmek için yeni bir şifre belirlemeniz gerekiyor.
  </p>

  <form (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="current">Mevcut şifre</label>
      <input
        id="current"
        name="current"
        type="password"
        autocomplete="current-password"
        required
        [ngModel]="currentPassword()"
        (ngModelChange)="currentPassword.set($event)"
        data-testid="current-password"
      />
    </div>

    <div class="field">
      <label for="new">Yeni şifre</label>
      <input
        id="new"
        name="new"
        type="password"
        autocomplete="new-password"
        required
        [ngModel]="newPassword()"
        (ngModelChange)="newPassword.set($event)"
        data-testid="new-password"
      />
      <small>En az 10 karakter olmalı.</small>
    </div>

    @if (errorMessage()) {
      <p class="error" role="alert" data-testid="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="busy()" data-testid="submit">
      {{ busy() ? 'Kaydediliyor…' : 'Şifreyi değiştir' }}
    </button>

    @if (busy()) {
      <p class="status" role="status" aria-live="polite" data-testid="loading">Kaydediliyor…</p>
    }
  </form>
</main>
