# scripts/check.conf — the steps behind the single verification contract (./scripts/check).
# Stack: .NET 10 (src/) + Angular 21 (web/) + PostgreSQL 17 (Testcontainers in integration tests).
# Format: <name>: <command> — runs in order, fails fast.
#
# ---------------------------------------------------------------------------------------------
# RESOURCE HYGIENE — envanter (docs/testing.md, Resource hygiene)
# Bu yığının geride bırakabileceği süreçler ve nötrleştirmeleri:
#   1. MSBuild worker node'ları (dotnet build/test)      -> -nodeReuse:false
#   2. Roslyn compile server, VBCSCompiler               -> -p:UseSharedCompilation=false
#                                                           (Directory.Build.props'ta da kapalı)
#   3. .NET build server (Razor/MSBuild kalıntısı)       -> son adımda 'dotnet build-server shutdown'
#   4. Testhost süreçleri (dotnet test)                  -> koşu sonunda çıkar; 3 ile birlikte garanti
#   5. Testcontainers PostgreSQL + Ryuk konteynerleri    -> aynı adımda 'docker stop', çıkış kodu korunarak
#   6. Angular test izleme (watch) modu ve tarayıcı      -> --watch=false, headless
#   7. Vite/esbuild servis süreci                        -> build/test modunda ebeveynle sonlanır
# Kanıt: residue test (./scripts/check iki kez; süreç sayısı ve bellek taban değere döner).
# ---------------------------------------------------------------------------------------------
#
# --- backend ---
restore: dotnet restore --nologo -nodeReuse:false
build: dotnet build --no-restore -c Release --nologo -nodeReuse:false
format: dotnet format --no-restore --verify-no-changes
#
# Test adımı: xUnit v3 test uygulamaları DOĞRUDAN koşturulur. .NET 10 SDK + xunit.v3 4.x ile
# 'dotnet test' köprüsü sıfır test keşfediyor (docs/testing.md, Frameworks & layout); doğrudan
# koşuda Microsoft.Testing.Platform her projenin test sayısını yazar ve sıfır test durumunda
# exit 5 verir -> AC-15 koruması araç tarafından sağlanır.
# resource hygiene: 5 — Testcontainers konteynerleri aynı adımda durdurulur, çıkış kodu korunur
test: sh -c 'export DOTNET_CLI_UI_LANGUAGE=en TESTINGPLATFORM_TELEMETRY_OPTOUT=1; rc=0; for p in tests/*/*.csproj; do echo "--- $p"; dotnet run --project "$p" -c Release --no-build || rc=1; done; docker ps -q --filter label=org.testcontainers=true | xargs -r docker stop >/dev/null 2>&1; exit $rc'
#
# --- frontend (web/) ---
# Kurulum YALNIZCA node_modules yoksa yapılır: check kurulumdan sonra çevrimdışı ve hızlı kalır
# (docs/security.md, Dependencies: ağ bağımlılığı check'i kırılgan yapar). Kilit dosyası
# değiştiğinde node_modules'ü silmek geliştiricinin işi; CI her koşuda temiz başlar.
webinstall: sh -c 'cd web && { [ -d node_modules ] || npm ci --no-fund --no-audit; }'
# ESLint + boundaries kuralı: yasak bağımlılık 5 (feature'lar arası import)
weblint: sh -c 'cd web && npm run lint'
# resource hygiene: 6 — vitest/jsdom, izleme modu kapalı, tarayıcı açılmaz
webtest: sh -c 'cd web && npm test -- --watch=false'
webbuild: sh -c 'cd web && npm run build'
